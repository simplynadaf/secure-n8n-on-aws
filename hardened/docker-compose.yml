# HARDENED n8n on AWS - the "after" state.
# n8n is NOT published to the host; only Caddy exposes 80/443 and terminates TLS.
# Secrets come from the environment (loaded from AWS Secrets Manager by
# scripts/load-secrets.sh), never hardcoded here. See ../README.md and ../HARDENING.md.

services:
  n8n:
    # PATCHED: >= 1.123.64 fixes CVE-2026-65589 (plaintext creds in LLM sub-node exec data)
    image: n8nio/n8n:1.123.64
    restart: unless-stopped
    expose:
      - "5678"                       # internal only - NOT published to the host
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      # Encryption key + DB password injected from AWS Secrets Manager (see scripts/)
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Hardening
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_USER_MANAGEMENT_JWT_DURATION_HOURS=2
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      # Postgres (no plaintext password here - from env / Secrets Manager)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    # no ports: -> only reachable by other containers on the internal network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  n8n_data:
  pg_data:
  caddy_data:
  caddy_config:
